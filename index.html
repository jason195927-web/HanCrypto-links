        :root {

        }
        .bebas { font-family: 'Bebas Neue', cursive; letter-spacing: 2px; }
        
        /* 霓虹金屬感卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .glass-card:hover {
            border: 1px solid rgba(139, 0, 0, 0.6);
            background: rgba(139, 0, 0, 0.05);
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 交易所專屬漸層 */
        .exchange-btn {
            background: linear-gradient(90deg, rgba(30,30,30,1) 0%, rgba(10,10,10,1) 100%);
            border-left: 4px solid var(--accent-red);
        }

        /* 水墨動態背景感 */
        .ink-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #121212 0%, #050505 100%);
            z-index: -1;
            opacity: 0.8;
        }

        /* SVG 圖示預設顏色與轉場 */
        svg {
            transition: all 0.3s ease;
            fill: #e0e0e0; /* 預設灰白色 */
        }
        .glass-card:hover svg {
            fill: var(--accent-red); /* 滑鼠游標移過去變成止損紅 */
            transform: scale(1.1);
        }
    </style>
</head>
