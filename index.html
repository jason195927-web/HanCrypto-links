    <style>
        :root {
            --primary-dark: #080808;
            --accent-red: #8B0000;
            --card-bg: rgba(20, 20, 20, 0.6);
        }
        body {
            background-color: var(--primary-dark);
            color: #e0e0e0;
            font-family: 'Noto Sans TC', sans-serif;
            background-image: radial-gradient(circle at 20% 30%, #1a1a1a 0%, #080808 100%);
        }
        .bebas { font-family: 'Bebas Neue', cursive; letter-spacing: 2px; }

        /* 社交媒體卡片基礎樣式 */
        .social-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* 懸停效果：加上紅色霓虹邊框與圖示放大 */
        .social-card:hover {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.3);
            transform: translateY(-5px);
        }

        .social-card i {
            font-size: 2.5rem;
            transition: all 0.3s ease;
            color: #ffffff;
        }

        .social-card:hover i {
            transform: scale(1.1);
        }

        /* 韓系浮水印字體 */
        .watermark {
            position: absolute;
            right: 10px;
            bottom: 10px;
            font-size: 3rem;
            opacity: 0.05;
            font-weight: 900;
            pointer-events: none;
            color: white;
        }
    </style>
</head>
